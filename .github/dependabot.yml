# Atualizações de dependências: um PR agrupado por ecossistema, por semana,
# somente com versões MINOR e PATCH (versões MAJOR exigem avaliação manual e passam pelo CCM).
version: 2
updates:
  - package-ecosystem: pip
    directories: ["/", "/extrator", "/erp_simulado"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      python:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: "/airflow"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
