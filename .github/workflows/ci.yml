# Integração Contínua — PGC seção 5 (Aula 2)
#
# Roda em todo Pull Request para a main. Cada job verifica uma parte do projeto e o
# job "ci-ok" consolida o resultado de todos.
#
# Na proteção da main, marque como obrigatórios SOMENTE:  ci-ok  e  titulo-pr
# (ADR 0004). Se um job individual fosse obrigatório e não rodasse, o PR ficaria
# travado em "Expected — Waiting for status".

name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualidade:
    name: Lint, testes e cobertura
    runs-on: ubuntu-latest
    # PostgreSQL real para os testes de integração do extrator e do ERP simulado.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: erp_teste
          POSTGRES_PASSWORD: erp_teste
          POSTGRES_DB: erp_protheus_teste
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp_teste"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PG_HOST: localhost
      PG_PORT: "5432"
      PG_DB: erp_protheus_teste
      PG_USER: erp_teste
      PG_PASSWORD: erp_teste
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      # PySpark 3.5 suporta Java até a versão 17; o Java padrão do runner é mais novo
      # e falha ao iniciar o Spark ("getSubject is not supported").
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Instalar dependências (versões fixas)
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Verificação de isolamento de catálogos e da landing
        run: python .github/scripts/verificar_isolamento.py
      - name: SAST (Bandit)
        run: bandit -c pyproject.toml -r extrator erp_simulado src/pdc_lib
      - name: Testes + quality gate de cobertura >= 60% (PGC 5.3)
        # Unitários (PySpark local) e integração (PostgreSQL) medidos juntos.
        run: >-
          python -m pytest tests
          --cov=pdc_lib --cov=pdc_extrator --cov=pdc_erp
          --cov-report=term-missing --cov-fail-under=60

  dependencias:
    name: Análise de dependências (SCA)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Bloqueia dependências novas com vulnerabilidade crítica (ADR 0005).
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: critical

  segredos:
    name: Varredura de segredos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  airflow:
    name: Build do Airflow e importação das DAGs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Criar .env de CI a partir do modelo (sem segredos reais)
        run: cp .env.example .env
      - name: Build da imagem
        run: docker compose build airflow
      - name: Teste de importação das DAGs
        run: >-
          docker compose run --rm --no-deps --entrypoint python airflow -c
          "from airflow.models.dagbag import DagBag;
          b = DagBag('/opt/airflow/dags', include_examples=False);
          assert not b.import_errors, b.import_errors;
          print(sorted(b.dag_ids))"

  bundle:
    name: Validação do Asset Bundle
    runs-on: ubuntu-latest
    # Secrets do repositório. PRs do Dependabot não recebem secrets: nesse caso a
    # validação é pulada com aviso, e o bundle é validado de novo no CD.
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: databricks/setup-cli@main
      - name: Validar targets dev e prd
        run: |
          if [ -z "$DATABRICKS_TOKEN" ]; then
            echo "::warning::Secrets do Databricks indisponíveis (ex.: PR do Dependabot); validação pulada."
            exit 0
          fi
          databricks bundle validate -t dev
          databricks bundle validate -t prd

  ci-ok:
    name: ci-ok
    if: always()
    needs: [qualidade, dependencias, segredos, airflow, bundle]
    runs-on: ubuntu-latest
    steps:
      - name: Conferir resultado dos jobs
        env:
          RESULTADOS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Resultados: $RESULTADOS"
          for r in $RESULTADOS; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::Algum job do CI falhou — merge bloqueado (PGC 5.2)."
              exit 1
            fi
          done
