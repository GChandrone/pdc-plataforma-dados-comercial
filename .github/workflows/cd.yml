name: CD

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  desenvolvimento:
    name: Deploy em Desenvolvimento
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: databricks/setup-cli@main
      - name: Deploy do bundle (target dev)
        run: databricks bundle deploy -t dev
      - name: Setup idempotente (catálogos, schemas e volume de landing)
        run: databricks bundle run -t dev job_setup
      - name: Execução do job com gates de qualidade de dados
        run: databricks bundle run -t dev job_comercial_diario

  producao:
    name: Deploy em Produção
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # O Environment prd exige aprovação manual (required reviewers) antes de liberar os secrets.
    environment: prd
    permissions:
      contents: write
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: databricks/setup-cli@main
      - name: Validação do bundle (target prd)
        run: databricks bundle validate -t prd
      - name: Deploy do bundle (target prd)
        run: databricks bundle deploy -t prd
      - name: Setup idempotente
        run: databricks bundle run -t prd job_setup
      - name: Smoke test (execução do job em Produção)
        run: databricks bundle run -t prd job_comercial_diario
      - name: Publicação do GitHub Release (baseline)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --generate-notes --verify-tag
