name: Correção
description: Defeito encontrado no pipeline, nos dados ou no dashboard
labels: ["fix"]
body:
  - type: textarea
    id: problema
    attributes:
      label: Problema observado
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Comportamento esperado
    validations:
      required: true
  - type: input
    id: ambiente
    attributes:
      label: Ambiente (Desenvolvimento ou Produção)
